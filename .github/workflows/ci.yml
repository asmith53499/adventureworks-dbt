name: dbt build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      # Seeds, models, data tests and unit tests against a throwaway DuckDB file
      - name: dbt build
        run: dbt build --target duckdb
