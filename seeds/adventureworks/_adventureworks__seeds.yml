version: 2

# Raw AdventureWorks tables, generated by scripts/fetch_adventureworks.py.
# Type inference is fine for most columns; the overrides below cover values that
# look numeric but must stay text (leading zeros, codes) and columns that are
# entirely null, which would otherwise be inferred as integers.

seeds:
  - name: sales_order_header
    description: One row per sales order (Sales.SalesOrderHeader).
    config:
      column_types:
        purchase_order_number: varchar
        account_number: varchar
        comment: varchar

  - name: sales_order_detail
    description: One row per sales order line (Sales.SalesOrderDetail).
    config:
      column_types:
        carrier_tracking_number: varchar

  - name: sales_order_header_sales_reason
    description: Bridge between sales orders and the reasons customers gave for buying.

  - name: sales_reason
    description: Lookup of purchase reasons (price, promotion, review, ...).

  - name: sales_territory
    description: Sales regions, grouped into North America, Europe and Pacific.

  - name: sales_person
    description: Employees who carry a sales quota.

  - name: sales_person_quota_history
    description: Sales quota assigned to each salesperson per period.

  - name: customer
    description: Customers - either an individual (person_id) or a reseller store (store_id).
    config:
      column_types:
        account_number: varchar

  - name: store
    description: Reseller stores that buy from AdventureWorks.

  - name: special_offer
    description: Discounts and promotions that can apply to an order line.

  - name: currency_rate
    description: Daily USD to foreign currency exchange rates.
    config:
      column_types:
        from_currency_code: varchar
        to_currency_code: varchar

  - name: currency
    description: ISO currency codes.
    config:
      column_types:
        currency_code: varchar

  - name: ship_method
    description: Shipping carriers and their rates.

  - name: product
    description: Products sold or used to manufacture sold products.
    config:
      column_types:
        product_number: varchar
        color: varchar
        size: varchar
        size_unit_measure_code: varchar
        weight_unit_measure_code: varchar
        product_line: varchar
        class: varchar
        style: varchar
        discontinued_date: varchar

  - name: product_subcategory
    description: Product subcategories (Mountain Bikes, Helmets, ...).

  - name: product_category
    description: Top-level product categories (Bikes, Components, Clothing, Accessories).

  - name: product_model
    description: Product models; several products (sizes/colors) share one model.

  - name: product_cost_history
    description: Standard cost of each product over time.

  - name: person
    description: People - customers, employees, store contacts and vendor contacts.
    config:
      column_types:
        person_type: varchar
        title: varchar
        middle_name: varchar
        suffix: varchar

  - name: address
    description: Street addresses used for billing and shipping.
    config:
      column_types:
        address_line2: varchar
        postal_code: varchar

  - name: state_province
    description: States and provinces, mapped to a country and sales territory.
    config:
      column_types:
        state_province_code: varchar
        country_region_code: varchar

  - name: country_region
    description: ISO country codes and names.
    config:
      column_types:
        country_region_code: varchar

  - name: employee
    description: Employees (sensitive HR columns removed by the fetch script).
